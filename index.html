<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Damier — Entraîneur de Dames Internationales</title>
<meta name="theme-color" content="#1c120a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%232E1D10'/%3E%3Ccircle cx='50' cy='50' r='30' fill='%23B08D57'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --walnut-950:#1c120a;
    --walnut-800:#2e1d10;
    --walnut-700:#3c2716;
    --board-dark:#4a2e18;
    --board-light:#e8dcc3;
    --ivory:#f1e9d8;
    --brass:#b08d57;
    --brass-bright:#d4ac70;
    --garnet:#7b1e2b;
    --garnet-bright:#a8324a;
    --white-piece:#f4efe3;
    --black-piece:#201512;
    --ok:#5b8c5a;
    font-size:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--walnut-950);color:var(--ivory);font-family:'Inter',sans-serif;overflow-x:hidden;}
  body{display:flex;flex-direction:column;min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}

  header{padding:14px 16px 6px;text-align:center;position:relative;}
  header h1{font-family:'Fraunces',serif;font-weight:700;font-size:1.35rem;margin:0;letter-spacing:.3px;color:var(--brass-bright);}
  header .sub{font-size:.72rem;color:#c9b89a;margin-top:2px;text-transform:uppercase;letter-spacing:1.5px;font-family:'IBM Plex Mono',monospace;}

  .statusbar{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:#d8c9ab;}
  .turn-pill{display:inline-flex;align-items:center;gap:6px;background:var(--walnut-700);padding:5px 10px;border-radius:20px;border:1px solid var(--brass);}
  .turn-dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
  .turn-dot.w{background:var(--white-piece);box-shadow:0 0 0 1px var(--brass);}
  .turn-dot.b{background:var(--black-piece);box-shadow:0 0 0 1px var(--garnet);}

  main{flex:1;display:flex;flex-direction:column;align-items:center;padding:4px 10px 10px;gap:10px;}

  .board-wrap{position:relative;width:min(94vw, 480px);aspect-ratio:1/1;border-radius:6px;padding:10px;background:linear-gradient(160deg,var(--walnut-700),var(--walnut-950));box-shadow:0 8px 30px rgba(0,0,0,.5), inset 0 0 0 2px var(--brass);}
  .board-wrap::before,.board-wrap::after{content:'';position:absolute;width:9px;height:9px;border-radius:50%;background:var(--brass);top:6px;left:6px;box-shadow:0 0 0 2px var(--walnut-950);}
  .board-wrap::after{left:auto;right:6px;}
  .corner-bl,.corner-br{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--brass);bottom:6px;box-shadow:0 0 0 2px var(--walnut-950);}
  .corner-bl{left:6px;} .corner-br{right:6px;}

  #board{display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);width:100%;height:100%;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px var(--walnut-950);}
  .sq{position:relative;display:flex;align-items:center;justify-content:center;}
  .sq.light{background:var(--board-light);}
  .sq.dark{background:var(--board-dark);}
  .sq.selectable::after{content:'';position:absolute;width:26%;height:26%;border-radius:50%;background:var(--brass-bright);opacity:.85;animation:pulse 1.4s ease-in-out infinite;}
  .sq.capturable::after{background:var(--garnet-bright);}
  @keyframes pulse{0%,100%{transform:scale(.85);opacity:.55;}50%{transform:scale(1.05);opacity:.95;}}
  .sq.origin{box-shadow:inset 0 0 0 3px var(--brass-bright);}
  .sq.mustmove::before{content:'';position:absolute;inset:2px;border:2px solid var(--garnet-bright);border-radius:3px;opacity:.8;pointer-events:none;}

  .piece{width:78%;height:78%;border-radius:50%;position:relative;cursor:pointer;transition:transform .12s ease;}
  .piece.w{background:radial-gradient(circle at 35% 30%, #fffdf7, var(--white-piece) 60%, #cbbfa4 100%);box-shadow:0 2px 4px rgba(0,0,0,.5), inset 0 0 0 2px var(--brass);}
  .piece.b{background:radial-gradient(circle at 35% 30%, #453329, var(--black-piece) 60%, #0c0705 100%);box-shadow:0 2px 4px rgba(0,0,0,.6), inset 0 0 0 2px var(--garnet);}
  .piece.king::after{content:'♛';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:var(--brass-bright);}
  .piece.b.king::after{color:var(--garnet-bright);}
  .piece:active{transform:scale(.92);}

  .panel{width:min(94vw,480px);background:var(--walnut-800);border:1px solid var(--walnut-700);border-radius:12px;padding:12px 14px;}
  .panel h2{font-family:'Fraunces',serif;font-size:.95rem;margin:0 0 8px;color:var(--brass-bright);display:flex;align-items:center;gap:6px;}
  .coach-q{font-size:.85rem;line-height:1.4;color:#e6dcc6;margin-bottom:8px;}
  .coach-q b{color:var(--brass-bright);}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;}
  button{font-family:'Inter',sans-serif;font-weight:600;font-size:.82rem;padding:9px 14px;border-radius:8px;border:1px solid var(--brass);background:transparent;color:var(--brass-bright);cursor:pointer;}
  button.primary{background:var(--brass);color:var(--walnut-950);}
  button:active{transform:scale(.97);}
  select{font-family:'Inter',sans-serif;font-size:.82rem;background:var(--walnut-700);color:var(--ivory);border:1px solid var(--brass);border-radius:8px;padding:8px 10px;}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;font-family:'IBM Plex Mono',monospace;}
  .stats div span{display:block;font-size:1.1rem;color:var(--brass-bright);font-weight:600;}
  .stats div small{font-size:.62rem;color:#c9b89a;text-transform:uppercase;letter-spacing:1px;}
  .hist{max-height:90px;overflow-y:auto;font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:#c9b89a;line-height:1.6;}
  .tag{display:inline-block;background:var(--walnut-700);border:1px solid var(--brass);border-radius:5px;padding:1px 6px;font-size:.68rem;margin-right:6px;}
  footer{text-align:center;font-size:.65rem;color:#8a7a63;padding:10px;font-family:'IBM Plex Mono',monospace;}
  .thinking{color:var(--garnet-bright);}
  ::-webkit-scrollbar{width:5px;} ::-webkit-scrollbar-thumb{background:var(--brass);border-radius:3px;}
</style>
</head>
<body>
<header>
  <h1>♛ Damier</h1>
  <div class="sub">Entraîneur de dames internationales · 10×10</div>
</header>

<div class="statusbar">
  <span class="turn-pill"><span class="turn-dot w" id="turnDotW"></span><span class="turn-dot b" id="turnDotB"></span> <span id="turnLabel">Blancs à jouer</span></span>
  <span id="capNotice"></span>
</div>

<main>
  <div class="board-wrap">
    <div class="corner-bl"></div><div class="corner-br"></div>
    <div id="board"></div>
  </div>

  <div class="panel" id="coachPanel">
    <h2>🧭 Coach virtuel</h2>
    <div class="coach-q" id="coachText">Qui contrôle le centre ? Observe le plateau avant de jouer.</div>
    <div class="btnrow">
      <button id="askCoach">Poser une question au coach</button>
      <button id="analyzeBtn">Analyser la position</button>
    </div>
  </div>

  <div class="panel">
    <div class="row" style="margin-bottom:10px;">
      <select id="modeSel">
        <option value="ai">Contre l'IA</option>
        <option value="pvp">Joueur contre joueur</option>
      </select>
      <select id="diffSel">
        <option value="1">Débutant</option>
        <option value="2">Amateur</option>
        <option value="3" selected>Joueur de club</option>
        <option value="4">Confirmé</option>
        <option value="5">Expert</option>
      </select>
    </div>
    <div class="btnrow">
      <button class="primary" id="newGameBtn">Nouvelle partie</button>
      <button id="undoBtn">Annuler</button>
    </div>
  </div>

  <div class="panel">
    <h2>📊 Progression (session)</h2>
    <div class="stats">
      <div><span id="stMen">40</span><small>Pièces</small></div>
      <div><span id="stCaps">0</span><small>Prises</small></div>
      <div><span id="stMoves">0</span><small>Coups</small></div>
    </div>
  </div>

  <div class="panel">
    <h2>📜 Historique</h2>
    <div class="hist" id="histList">—</div>
  </div>
</main>

<footer>V1 · gratuit · hors ligne · FMJD (règles internationales 10×10)</footer>

<script>
/* ============================================================
   MOTEUR — Dames internationales (FMJD), plateau 10x10
   ============================================================ */
const SIZE = 10;
const DIRS = [[-1,-1],[-1,1],[1,-1],[1,1]];
const key = (r,c)=> r*10+c;

function initBoard(){
  const b = Array.from({length:SIZE},()=>Array(SIZE).fill(null));
  for(let r=0;r<4;r++) for(let c=0;c<10;c++) if((r+c)%2===1) b[r][c]={color:'b',king:false};
  for(let r=6;r<10;r++) for(let c=0;c<10;c++) if((r+c)%2===1) b[r][c]={color:'w',king:false};
  return b;
}
function inB(r,c){return r>=0&&r<SIZE&&c>=0&&c<SIZE;}
function cloneBoard(b){return b.map(row=>row.map(p=>p?{...p}:null));}

// -- Génération des prises (récursif, règle de prise maximale) --
function findImmediateCaptures(board,r,c,piece,capturedSet){
  const res=[];
  for(const d of DIRS){
    if(piece.king){
      let rr=r+d[0], cc=c+d[1];
      while(inB(rr,cc) && board[rr][cc]===null){ rr+=d[0]; cc+=d[1]; }
      if(inB(rr,cc) && board[rr][cc] && board[rr][cc].color!==piece.color && !capturedSet.has(key(rr,cc))){
        let lr=rr+d[0], lc=cc+d[1];
        while(inB(lr,lc) && board[lr][lc]===null){
          res.push({to:{r:lr,c:lc}, captured:{r:rr,c:cc}});
          lr+=d[0]; lc+=d[1];
        }
      }
    } else {
      const mr=r+d[0], mc=c+d[1], lr=r+2*d[0], lc=c+2*d[1];
      if(inB(lr,lc) && inB(mr,mc) && board[mr][mc] && board[mr][mc].color!==piece.color && !capturedSet.has(key(mr,mc)) && board[lr][lc]===null){
        res.push({to:{r:lr,c:lc}, captured:{r:mr,c:mc}});
      }
    }
  }
  return res;
}
function buildCaptureSequences(board,r,c,piece,capturedSet,path){
  const caps = findImmediateCaptures(board,r,c,piece,capturedSet);
  if(caps.length===0){
    if(path.length===0) return [];
    return [{path:path.slice(), capturedCount:capturedSet.size}];
  }
  let out=[];
  for(const cap of caps){
    const ns = new Set(capturedSet); ns.add(key(cap.captured.r,cap.captured.c));
    const np = path.concat([{r:cap.to.r,c:cap.to.c,captured:cap.captured}]);
    out = out.concat(buildCaptureSequences(board,cap.to.r,cap.to.c,piece,ns,np));
  }
  return out;
}
function simpleMoves(board,r,c,piece){
  const moves=[];
  if(piece.king){
    for(const d of DIRS){
      let rr=r+d[0], cc=c+d[1];
      while(inB(rr,cc) && board[rr][cc]===null){ moves.push({r:rr,c:cc}); rr+=d[0]; cc+=d[1]; }
    }
  } else {
    const dirs = piece.color==='w' ? [[-1,-1],[-1,1]] : [[1,-1],[1,1]];
    for(const d of dirs){
      const rr=r+d[0], cc=c+d[1];
      if(inB(rr,cc) && board[rr][cc]===null) moves.push({r:rr,c:cc});
    }
  }
  return moves;
}
// Retourne la liste complète des coups légaux pour `color` (règle de prise obligatoire + maximale)
function legalMoves(board,color){
  let allCaptures=[];
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    const p = board[r][c];
    if(p && p.color===color){
      const seqs = buildCaptureSequences(board,r,c,p,new Set(),[]);
      for(const s of seqs) allCaptures.push({from:{r,c}, path:s.path, count:s.path.length, isCapture:true});
    }
  }
  if(allCaptures.length>0){
    const max = Math.max(...allCaptures.map(m=>m.count));
    return allCaptures.filter(m=>m.count===max);
  }
  const moves=[];
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    const p = board[r][c];
    if(p && p.color===color){
      for(const to of simpleMoves(board,r,c,p)) moves.push({from:{r,c}, path:[{r:to.r,c:to.c}], count:0, isCapture:false});
    }
  }
  return moves;
}
function applyMove(board,move){
  const b = cloneBoard(board);
  const {r:fr,c:fc} = move.from;
  const piece = {...b[fr][fc]};
  b[fr][fc]=null;
  let last = move.from;
  for(const step of move.path){
    if(step.captured) b[step.captured.r][step.captured.c]=null;
    last = {r:step.r, c:step.c};
  }
  if((piece.color==='w' && last.r===0) || (piece.color==='b' && last.r===9)) piece.king=true;
  b[last.r][last.c]=piece;
  return b;
}
function countMaterial(board){
  let wm=0,wk=0,bm=0,bk=0;
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    const p=board[r][c]; if(!p) continue;
    if(p.color==='w'){ p.king?wk++:wm++; } else { p.king?bk++:bm++; }
  }
  return {wm,wk,bm,bk};
}
function evaluate(board, forColor){
  const {wm,wk,bm,bk} = countMaterial(board);
  let score = (wm*100+wk*320) - (bm*100+bk*320);
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    const p=board[r][c]; if(!p) continue;
    const centerBonus = 4 - (Math.abs(r-4.5)+Math.abs(c-4.5))*0.5;
    const advBonus = p.king?0:(p.color==='w' ? (9-r)*1.2 : r*1.2);
    const val = centerBonus + advBonus;
    score += p.color==='w' ? val : -val;
  }
  return forColor==='w' ? score : -score;
}
function minimax(board,depth,alpha,beta,maximizing,color){
  const opponent = color==='w'?'b':'w';
  const current = maximizing? color: opponent;
  const moves = legalMoves(board,current);
  if(depth===0 || moves.length===0){
    if(moves.length===0) return maximizing ? -100000+depth : 100000-depth;
    return evaluate(board,color);
  }
  if(maximizing){
    let best=-Infinity;
    for(const m of moves){
      const nb = applyMove(board,m);
      const v = minimax(nb,depth-1,alpha,beta,false,color);
      best=Math.max(best,v); alpha=Math.max(alpha,v);
      if(beta<=alpha) break;
    }
    return best;
  } else {
    let best=Infinity;
    for(const m of moves){
      const nb = applyMove(board,m);
      const v = minimax(nb,depth-1,alpha,beta,true,color);
      best=Math.min(best,v); beta=Math.min(beta,v);
      if(alpha>=beta) break;
    }
    return best;
  }
}
function pickAIMove(board,color,depth){
  const moves = legalMoves(board,color);
  if(moves.length===0) return null;
  let best=null, bestScore=-Infinity;
  for(const m of moves){
    const nb = applyMove(board,m);
    const v = minimax(nb,depth-1,-Infinity,Infinity,false,color);
    if(v>bestScore){ bestScore=v; best=m; }
  }
  return best;
}
const DIFF_DEPTH = {1:2,2:3,3:4,4:6,5:7};

/* ============================================================
   ETAT DE JEU & UI
   ============================================================ */
let board = initBoard();
let turn = 'w';
let mode = 'ai';       // 'ai' | 'pvp'
let aiColor = 'b';
let depth = DIFF_DEPTH[3];
let selected = null;   // {r,c}
let moveOptions = [];  // legal moves for selected piece
let history = [];      // {board, turn} snapshots for undo
let totalCaptures = 0;
let totalMoves = 0;
let gameOver = false;

const boardEl = document.getElementById('board');
const turnLabel = document.getElementById('turnLabel');
const turnDotW = document.getElementById('turnDotW');
const turnDotB = document.getElementById('turnDotB');
const capNotice = document.getElementById('capNotice');
const histList = document.getElementById('histList');
const coachText = document.getElementById('coachText');

function render(){
  boardEl.innerHTML='';
  const legal = gameOver? [] : legalMoves(board,turn);
  const mustMoveFrom = new Set(legal.filter(m=>m.isCapture).map(m=>key(m.from.r,m.from.c)));
  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      const sq = document.createElement('div');
      const dark = (r+c)%2===1;
      sq.className = 'sq ' + (dark?'dark':'light');
      sq.dataset.r=r; sq.dataset.c=c;
      if(selected && selected.r===r && selected.c===c) sq.classList.add('origin');
      if(dark && mustMoveFrom.has(key(r,c)) && !(selected && selected.r===r && selected.c===c)) sq.classList.add('mustmove');
      const optHit = moveOptions.find(o=>o.dest.r===r && o.dest.c===c);
      if(optHit){ sq.classList.add('selectable'); if(optHit.move.isCapture) sq.classList.add('capturable'); }
      const p = board[r][c];
      if(p){
        const pd = document.createElement('div');
        pd.className = 'piece '+p.color+(p.king?' king':'');
        sq.appendChild(pd);
      }
      sq.addEventListener('click', onSquareClick);
      boardEl.appendChild(sq);
    }
  }
  turnLabel.textContent = gameOver ? 'Partie terminée' : (turn==='w'?'Blancs à jouer':'Noirs à jouer');
  turnDotW.style.opacity = turn==='w'?1:.3;
  turnDotB.style.opacity = turn==='b'?1:.3;
  const mustCapture = legal.length>0 && legal[0].isCapture;
  capNotice.textContent = mustCapture ? '⚠ Prise obligatoire' : '';
  const mat = countMaterial(board);
  document.getElementById('stMen').textContent = (mat.wm+mat.wk+mat.bm+mat.bk);
  document.getElementById('stCaps').textContent = totalCaptures;
  document.getElementById('stMoves').textContent = totalMoves;
}

function onSquareClick(e){
  if(gameOver) return;
  if(mode==='ai' && turn===aiColor) return;
  const r = +e.currentTarget.dataset.r, c = +e.currentTarget.dataset.c;
  const legal = legalMoves(board,turn);

  if(selected){
    const chosen = moveOptions.find(o=>o.dest.r===r && o.dest.c===c);
    if(chosen){ playMove(chosen.move); selected=null; moveOptions=[]; render(); maybeAITurn(); return; }
  }
  const p = board[r][c];
  if(p && p.color===turn){
    const pieceMoves = legal.filter(m=>m.from.r===r && m.from.c===c);
    if(pieceMoves.length===0){ selected=null; moveOptions=[]; render(); return; }
    selected={r,c};
    moveOptions = pieceMoves.map(m=>({ dest:m.path[m.path.length-1], move:m }));
  } else {
    selected=null; moveOptions=[];
  }
  render();
}

function playMove(move){
  history.push({board:cloneBoard(board), turn});
  if(move.isCapture) totalCaptures += move.count;
  totalMoves++;
  board = applyMove(board,move);
  logMove(move);
  turn = turn==='w'?'b':'w';
  checkGameOver();
  updateCoachHint();
}
function checkGameOver(){
  const legal = legalMoves(board,turn);
  if(legal.length===0){
    gameOver=true;
    const winner = turn==='w' ? 'Noirs' : 'Blancs';
    coachText.innerHTML = `<b>Partie terminée — victoire des ${winner}.</b> ${turn==='w'?'Blancs':'Noirs'} ne peuvent plus jouer.`;
  }
}
function logMove(move){
  const cols='abcdefghij';
  const from = cols[move.from.c]+(10-move.from.r);
  const last = move.path[move.path.length-1];
  const to = cols[last.c]+(10-last.r);
  const sep = move.isCapture? 'x' : '-';
  const line = document.createElement('div');
  line.innerHTML = `<span class="tag">${totalMoves}</span>${from}${sep}${to}`;
  histList.prepend(line);
}
function maybeAITurn(){
  if(gameOver) return;
  if(mode==='ai' && turn===aiColor){
    coachText.textContent = "L'IA réfléchit…";
    setTimeout(()=>{
      const m = pickAIMove(board,aiColor,depth);
      if(m){ playMove(m); render(); }
      if(!gameOver) updateCoachHint();
    }, 60);
  }
}
function updateCoachHint(){
  if(gameOver) return;
  const questions = [
    "Qui contrôle le centre du damier en ce moment ?",
    "Une de tes pièces est-elle mal placée ou vulnérable ?",
    "Quelles sont les menaces immédiates de l'adversaire ?",
    "Quels sont tes 2-3 coups candidats ?",
    "Quel est ton plan pour les prochains coups ?"
  ];
  coachText.innerHTML = "<b>" + questions[Math.floor(Math.random()*questions.length)] + "</b> Réfléchis avant de jouer — le coach peut t'aider avec « Analyser la position ».";
}

document.getElementById('askCoach').addEventListener('click', ()=>{
  updateCoachHint();
});
document.getElementById('analyzeBtn').addEventListener('click', ()=>{
  const legal = legalMoves(board,turn);
  if(legal.length===0){ coachText.textContent = "Plus aucun coup légal disponible."; return; }
  const evalScore = evaluate(board,'w');
  const side = evalScore>=0 ? 'Blancs' : 'Noirs';
  const mustCapture = legal[0].isCapture;
  let msg = `Évaluation actuelle : avantage aux <b>${side}</b> (score ${Math.abs(Math.round(evalScore))}). `;
  msg += mustCapture ? "Une prise est obligatoire : vérifie laquelle capture le plus de pièces." : "Pense au contrôle du centre et à la sécurité de tes pièces avant d'avancer.";
  coachText.innerHTML = msg;
});
document.getElementById('newGameBtn').addEventListener('click', ()=>{
  board = initBoard(); turn='w'; selected=null; moveOptions=[]; history=[];
  totalCaptures=0; totalMoves=0; gameOver=false; histList.innerHTML='—';
  render(); updateCoachHint(); maybeAITurn();
});
document.getElementById('undoBtn').addEventListener('click', ()=>{
  if(history.length===0) return;
  const steps = (mode==='ai') ? 2 : 1; // annule aussi le coup de l'IA
  for(let i=0;i<steps && history.length>0;i++){
    const h = history.pop();
    board = h.board; turn = h.turn; gameOver=false;
  }
  selected=null; moveOptions=[];
  render(); updateCoachHint();
});
document.getElementById('modeSel').addEventListener('change', e=>{
  mode = e.target.value;
  document.getElementById('diffSel').style.display = mode==='ai' ? 'inline-block':'none';
  render(); maybeAITurn();
});
document.getElementById('diffSel').addEventListener('change', e=>{
  depth = DIFF_DEPTH[e.target.value];
});

render();
updateCoachHint();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
